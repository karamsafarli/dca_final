services:
  postgres:
    image: postgres:16-alpine
    container_name: urban_crisis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crisis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crisis_pass}
      POSTGRES_DB: ${POSTGRES_DB:-urban_crisis}
    ports:
      # Local tools/tests only; never exposed on the network interface
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crisis_user} -d ${POSTGRES_DB:-urban_crisis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urban_crisis_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-crisis_user}:${POSTGRES_PASSWORD:-crisis_pass}@postgres:5432/${POSTGRES_DB:-urban_crisis}?schema=public
      JWT_SECRET: ${JWT_SECRET:-urban-crisis-hackathon-2026-super-secret-jwt-key}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ROUTING_API_URL: http://routing-api:4100
      ROUTING_API_CONTROL_TOKEN: ${ROUTING_API_CONTROL_TOKEN:-dev-routing-control-token}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000,http://localhost:5173}
    ports:
      # Local tools/tests only. Public traffic goes through nginx (frontend), which
      # sets the real client IP; binding to 127.0.0.1 stops X-Forwarded-For spoofing
      # that could bypass the per-IP SOS rate limit.
      - "127.0.0.1:${BACKEND_HOST_PORT:-4050}:4000"

  # Simulated EXTERNAL Map & Routing API (Challenge Drop #2). A separate
  # container so its outages are real network failures for the backend.
  # Stop it (`docker compose stop routing-api`) or use the dispatcher's
  # "API: 503 / >5 s" buttons to see the circuit breaker + fallback work.
  routing-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urban_crisis_routing_api
    restart: unless-stopped
    command: ["node", "src/external/routingApiServer.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ROUTING_API_PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_USER:-crisis_user}:${POSTGRES_PASSWORD:-crisis_pass}@postgres:5432/${POSTGRES_DB:-urban_crisis}?schema=public
      JWT_SECRET: ${JWT_SECRET:-urban-crisis-hackathon-2026-super-secret-jwt-key}
      ROUTING_API_CONTROL_TOKEN: ${ROUTING_API_CONTROL_TOKEN:-dev-routing-control-token}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urban_crisis_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
